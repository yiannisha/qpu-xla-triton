name: Run Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'integrations/llama_cpp/**'
      - 'artifact/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'MANIFEST.in'
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      # Install a specific version of uv.
      # with:
      #     version: "x.y.z"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Install locked development environment
      run: uv sync --locked --group dev

    - name: Verify artifact evidence and portable entry point
      run: uv run --locked python scripts/artifact.py smoke --output build/artifact-ci-smoke

    - name: Check main manuscript values from retained measurements
      run: uv run --locked python scripts/reproduce_paper.py --output build/paper-ci-analysis

    - name: Run format checker
      run: |
        uv run --locked ruff format --check src/qpu_xla tests/test_qpu_xla_*.py
        uv run --locked ruff format --check scripts/artifact*.py scripts/reproduce_paper.py scripts/prepare_artifact_native.py scripts/prepare_imagenet_samples.py scripts/run_llama_cpp_ffn_ablation.py scripts/summarize_rebuttal_remaining.py scripts/summarize_llama_cpp_ffn_split_screen.py tests/conftest.py tests/test_artifact.py

    - name: Run linter
      run: |
        uv run --locked ruff check src/qpu_xla tests/test_qpu_xla_*.py
        uv run --locked ruff check scripts/artifact*.py scripts/reproduce_paper.py scripts/prepare_artifact_native.py scripts/prepare_imagenet_samples.py scripts/run_llama_cpp_ffn_ablation.py scripts/summarize_rebuttal_remaining.py scripts/summarize_llama_cpp_ffn_split_screen.py tests/conftest.py tests/test_artifact.py

    - name: Run type checker
      run: uv run mypy src/qpu_xla

    - name: Run CPU/fake-backend tests
      run: uv run pytest -q tests -m 'not hardware'
