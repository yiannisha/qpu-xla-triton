name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup uv
      uses: astral-sh/setup-uv@v4
      # Install a specific version of uv.
      # with:
      #     version: "x.y.z"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Install locked development environment
      run: uv sync --group dev

    - name: Run format checker
      run: uv run ruff format --check src/qpu_xla tests/test_qpu_xla_*.py

    - name: Run linter
      run: uv run ruff check src/qpu_xla tests/test_qpu_xla_*.py

    - name: Run type checker
      run: uv run mypy src/qpu_xla

    - name: Run CPU/fake-backend tests
      run: uv run pytest -q tests -m 'not hardware'
